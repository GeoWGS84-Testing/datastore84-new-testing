# ══════════════════════════════════════════════════════════════════════════
#  🎮  PLAYWRIGHT ARENA — sharded end-to-end test run
#  Triggers: push/PR to main  ·  daily raid @ 1 PM IST  ·  manual quest
# ══════════════════════════════════════════════════════════════════════════

name: 🎮 Playwright Arena

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # ── Daily raid — 1:00 PM IST (07:30 UTC) ─────────────────────────────
  schedule:
    - cron: "30 7 * * *"

  # ── Manual quest — pick your loadout ─────────────────────────────────
  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Choose your browser class"
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      workers:
        description: "⚡ Party size (workers per shard)"
        required: false
        default: "4"
        type: choice
        options: ["1", "2", "4", "8"]

      test_grep:
        description: "🔍 Target specific quests (name/regex, blank = all)"
        required: false
        default: ""
        type: string

      headless:
        description: "👻 Stealth mode (headless)"
        required: false
        default: true
        type: boolean

      send_report:
        description: "📜 Send victory scroll (email report) after the run"
        required: false
        default: true
        type: boolean

      debug_mode:
        description: "🐛 Enable verbose debug logging"
        required: false
        default: false
        type: boolean

# ══════════════════════════════════════════════════════════════════════════

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ══════════════════════════════════════════════════════════════════════════

jobs:

  # ── The arena floor: 8 parties fighting in parallel ─────────────────────
  test:
    name: "⚔️ Battle — party ${{ matrix.shard }} / 8"
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: "🗺️ Scout the repository"
        uses: actions/checkout@v5

      - name: "🧙 Summon Node.js 22"
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: "🎒 Gear up (install dependencies)"
        run: npm ci

      - name: "🛡️ Equip browser engine"
        env:
          PW_BROWSER: ${{ inputs.browser || 'chromium' }}
        run: npx playwright install --with-deps "$PW_BROWSER"

      - name: "⏱️ Start the clock"
        run: echo "battle_start=$(date +%s)" >> "$GITHUB_ENV"

      - name: "⚡ Enter the arena — party ${{ matrix.shard }} / 8"
        id: battle
        env:
          HEADLESS:   ${{ inputs.headless  != 'false' && 'true' || 'false' }}
          PW_WORKERS: ${{ inputs.workers   || '4' }}
          PW_BROWSER: ${{ inputs.browser   || 'chromium' }}
          PW_GREP:    ${{ inputs.test_grep || '' }}
          DEBUG:      ${{ inputs.debug_mode == 'true' && 'pw:api,pw:browser' || '' }}
        run: |
          GREP_ARGS=()
          [[ -n "$PW_GREP" ]] && GREP_ARGS+=(--grep "$PW_GREP")

          npx playwright test \
            --project="$PW_BROWSER" \
            --shard=${{ matrix.shard }}/8 \
            "${GREP_ARGS[@]}"

      - name: "🏅 Log battle outcome"
        if: always()
        run: |
          duration=$(( $(date +%s) - battle_start ))
          mkdir -p diagnostics
          cat > "diagnostics/status-${{ matrix.shard }}.json" <<EOF
          {"shard": ${{ matrix.shard }}, "outcome": "${{ steps.battle.outcome }}", "duration": $duration}
          EOF
          {
            echo "### ⚔️ Party ${{ matrix.shard }} battle report"
            echo ""
            echo "| Stat | Value |"
            echo "|---|---|"
            echo "| Outcome | ${{ steps.battle.outcome }} |"
            echo "| Duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "💎 Collect blob loot"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: "📦 Collect battle report"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: "🧩 Collect test results"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: "🔬 Collect diagnostics"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ matrix.shard }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ── The herald: gathers all loot and sends the victory scroll ──────────
  email-report:
    name: "📜 Herald — send the scroll"
    # Skip on manual runs where the sender opted out
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.send_report == 'true')
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: "🗺️ Scout the repository"
        uses: actions/checkout@v5

      - name: "🧙 Summon Node.js 22"
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: "🎒 Gear up (install dependencies)"
        run: npm ci

      - name: "💰 Gather diagnostics loot"
        uses: actions/download-artifact@v7
        with:
          pattern: diagnostics-*
          merge-multiple: true
          path: diagnostics

      - name: "💰 Gather test result loot"
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      - name: "💰 Gather battle report loot"
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-report-*
          merge-multiple: true
          path: playwright-report

      - name: "💰 Gather blob loot"
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: blob-reports

      - name: "📜 Send the victory scroll (consolidated report)"
        if: always()
        env:
          CI: "true"
          DAILY_REPORT_EMAILS:  ${{ secrets.DAILY_REPORT_EMAILS }}
          FAILURE_ALERT_EMAILS: ${{ secrets.FAILURE_ALERT_EMAILS }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:          ${{ secrets.SMTP_SECURE }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          SMTP_FROM:            ${{ secrets.SMTP_FROM }}
        run: npm run report:email

      - name: "🗺️ Draw the battle map"
        if: always()
        run: |
          {
            echo "# 🏆 Playwright Arena — run summary"
            echo ""
            echo '```mermaid'
            echo "flowchart LR"
            echo "  T[\"🎮 Trigger\"] --> M{\"Arena\"}"
            for f in diagnostics/status-*.json; do
              [ -e "$f" ] || continue
              shard=$(jq -r .shard "$f")
              outcome=$(jq -r .outcome "$f")
              dur=$(jq -r .duration "$f")
              icon="💀"
              [ "$outcome" = "success" ] && icon="✅"
              echo "  M --> P${shard}[\"$icon Party $shard · ${dur}s\"]"
              echo "  P${shard} --> H[\"📜 Herald\"]"
            done
            echo "  classDef win fill:#1D9E75,stroke:#0F6E56,color:#ffffff;"
            echo "  classDef loss fill:#E24B4A,stroke:#A32D2D,color:#ffffff;"
            for f in diagnostics/status-*.json; do
              [ -e "$f" ] || continue
              shard=$(jq -r .shard "$f")
              outcome=$(jq -r .outcome "$f")
              cls="loss"
              [ "$outcome" = "success" ] && cls="win"
              echo "  class P${shard} $cls"
            done
            echo '```'
            echo ""
            echo "| Party | Outcome | Duration |"
            echo "|---|---|---|"
            for f in diagnostics/status-*.json; do
              [ -e "$f" ] || continue
              shard=$(jq -r .shard "$f")
              outcome=$(jq -r .outcome "$f")
              dur=$(jq -r .duration "$f")
              badge="💀 Defeat"
              [ "$outcome" = "success" ] && badge="🏅 Victory"
              echo "| Party $shard | $badge | ${dur}s |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
