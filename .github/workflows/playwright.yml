name: Playwright Tests

on:
  schedule:
    # - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read         # ★ FIX: Required for actions/checkout to clone the repository
      actions: write         # Required to delete artifacts via gh api

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # ──────────────────────────────────────────────
    # ★ FIX 1: Delete ALL old artifacts BEFORE the run
    #   Uses native GitHub CLI instead of the broken third-party action
    # ──────────────────────────────────────────────
    - name: Delete Old Artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARTIFACT_IDS=$(gh api --paginate "/repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[] | .id')
        if [ -n "$ARTIFACT_IDS" ]; then
          echo "$ARTIFACT_IDS" | xargs -I {} gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/{}"
          echo "✅ Deleted old artifacts."
        else
          echo "ℹ️ No old artifacts to delete."
        fi

    - name: Run Playwright Tests
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
        DAILY_REPORT_EMAILS: ${{ secrets.DAILY_REPORT_EMAILS }}
        FAILURE_ALERT_EMAILS: ${{ secrets.FAILURE_ALERT_EMAILS }}
        HEADLESS: 'true'
        REPORT_TIMEZONE: 'Asia/Kolkata'
        PAUSE_MULTIPLIER: '0.3'
        CI: 'true'
      run: npx playwright test

    # ──────────────────────────────────────────────
    # ★ FIX 2: Merge all 3 artifacts into ONE
    # ──────────────────────────────────────────────
    - name: Merge report folders for single upload
      if: always()
      run: |
        mkdir -p upload-artifact/playwright-report
        mkdir -p upload-artifact/test-results
        mkdir -p upload-artifact/diagnostics

        [ -d playwright-report ] && cp -r playwright-report/* upload-artifact/playwright-report/ 2>/dev/null || true
        [ -d test-results ]     && cp -r test-results/*     upload-artifact/test-results/     2>/dev/null || true
        [ -d diagnostics ]      && cp -r diagnostics/*      upload-artifact/diagnostics/      2>/dev/null || true

    # ──────────────────────────────────────────────
    # ★ FIX 3: Upload ONLY on failure
    # ──────────────────────────────────────────────
    - name: Upload All Artifacts (failure only)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report-${{ github.run_number }}
        path: upload-artifact/
        retention-days: 1
        if-no-files-found: ignore   # ★ Prevents warnings if folder is empty

    # ──────────────────────────────────────────────
    # ★ FIX 4: Always upload just the HTML report
    # ──────────────────────────────────────────────
    - name: Upload HTML Report (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-report-${{ github.run_number }}
        path: playwright-report/index.html
        retention-days: 1
        if-no-files-found: ignore   # ★ Prevents warnings if tests failed before generating report
