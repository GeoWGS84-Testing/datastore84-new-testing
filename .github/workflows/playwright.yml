# ══════════════════════════════════════════════════════════════════════════
# 🎭 Playwright Test Suite — DataStore GeoWGS84
#
# Execution remains the original 8-shard Playwright workflow.
# Added only:
#   • pre-run cleanup of older completed runs of THIS workflow
#   • per-shard diagnostic metrics
#   • consolidated GitHub Actions dashboard
#   • safer log/exit-code capture
#
# [DIAG-DEBUG] is the ONLY source used for warning/error/test metrics.
# ══════════════════════════════════════════════════════════════════════════

name: 🎭 Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Daily at 1:00 PM IST (07:30 UTC)
  schedule:
    - cron: "30 7 * * *"

  workflow_dispatch:
    inputs:
      browser:
        description: "🌐 Browser"
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      workers:
        description: "⚡ Workers per shard"
        required: false
        default: "4"
        type: choice
        options: ["1", "2", "4", "8"]

      test_grep:
        description: "🔍 Filter tests by name / regex (leave blank to run all)"
        required: false
        default: ""
        type: string

      headless:
        description: "👻 Run headless"
        required: false
        default: true
        type: boolean

      send_report:
        description: "📧 Send email report after run"
        required: false
        default: true
        type: boolean

      debug_mode:
        description: "🐛 Enable verbose Playwright debug logging"
        required: false
        default: false
        type: boolean

# Required by the cleanup job to delete older completed runs of this workflow.
permissions:
  contents: read
  actions: write

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  # Keep the original behavior: do not cancel a run that is already in progress.
  cancel-in-progress: false

jobs:

  # ════════════════════════════════════════════════════════════════════════
  # 🧹 PRE-RUN CLEANUP
  # Deletes older COMPLETED runs of this workflow before the current matrix
  # starts. The current run is always preserved.
  # ════════════════════════════════════════════════════════════════════════
  cleanup-previous:
    name: "🧹 Cleanup previous automation runs"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: "🗑️ Delete previous completed runs of this workflow"
        uses: actions/github-script@v9
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const workflowRef = process.env.WORKFLOW_REF || '';
            const match = workflowRef.match(/\.github\/workflows\/([^@]+)@/);

            if (!match) {
              core.info(`Could not determine workflow file from github.workflow_ref: ${workflowRef}`);
              core.summary
                .addHeading('🧹 Previous Run Cleanup')
                .addRaw('Could not determine the workflow file, so no previous runs were deleted. The current run is preserved.')
                .write();
              return;
            }

            const workflowFile = match[1];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: workflowFile,
                status: 'completed',
                per_page: 100
              }
            );

            const previousRuns = runs
              .filter(run => run.id !== currentRunId)
              .sort((a, b) => b.id - a.id);

            let deleted = 0;
            let failed = 0;

            for (const run of previousRuns) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });

                deleted += 1;
                core.info(`Deleted previous run #${run.run_number} (${run.id})`);
              } catch (error) {
                failed += 1;
                // Keep cleanup failures out of GitHub's warning/error annotation list.
                core.info(`Could not delete run #${run.run_number} (${run.id}): ${error.message}`);
              }
            }

            core.info(`Cleanup complete: deleted ${deleted} previous run(s); ${failed} deletion(s) failed.`);

            await core.summary
              .addHeading('🧹 Previous Run Cleanup')
              .addTable([
                [
                  { data: 'Metric', header: true },
                  { data: 'Count', header: true }
                ],
                ['Previous completed runs found', String(previousRuns.length)],
                ['Runs deleted', String(deleted)],
                ['Deletion failures', String(failed)]
              ])
              .addRaw('\nOlder completed runs of this workflow were removed. The current run was preserved.')
              .write();

  # ════════════════════════════════════════════════════════════════════════
  # 🧪 ORIGINAL 8-SHARD TEST MATRIX
  # The actual Playwright invocation/options are intentionally unchanged.
  # ════════════════════════════════════════════════════════════════════════
  test:
    needs: cleanup-previous
    name: "🧪 Shard ${{ matrix.shard }}/8 · ${{ inputs.browser || 'chromium' }} · ${{ inputs.workers || '4' }}W"
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v7

      - name: "⬢ Setup Node.js 22"
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🎭 Install Playwright browsers"
        env:
          PW_BROWSER: ${{ inputs.browser || 'chromium' }}
        run: npx playwright install --with-deps "$PW_BROWSER"

      # ── ORIGINAL TEST EXECUTION ────────────────────────────────────────
      # Only the stdout/stderr capture was added. The Playwright arguments
      # remain the same as the original workflow.
      - name: "🚀 Run Playwright — shard ${{ matrix.shard }} / 8"
        env:
          HEADLESS:   ${{ inputs.headless != 'false' && 'true' || 'false' }}
          PW_WORKERS: ${{ inputs.workers || '4' }}
          PW_BROWSER: ${{ inputs.browser || 'chromium' }}
          PW_GREP:    ${{ inputs.test_grep || '' }}
          DEBUG:      ${{ inputs.debug_mode == 'true' && 'pw:api,pw:browser' || '' }}
        run: |
          GREP_ARGS=()
          if [[ -n "$PW_GREP" ]]; then
            GREP_ARGS+=(--grep "$PW_GREP")
          fi

          # Capture the complete Playwright output while preserving the real
          # Playwright process exit code.
          set -o pipefail
          set +e
          npx playwright test \
            --project="$PW_BROWSER" \
            --shard=${{ matrix.shard }}/8 \
            "${GREP_ARGS[@]}" 2>&1 | tee "shard-${{ matrix.shard }}.log"

          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "$TEST_EXIT" > "shard-${{ matrix.shard }}-exit-code.txt"
          exit "$TEST_EXIT"

      # ════════════════════════════════════════════════════════════════════
      # 📊 SHARD METRICS
      # ONLY exact [DIAG-DEBUG] test-result records are parsed.
      # ════════════════════════════════════════════════════════════════════
      - name: "📊 Generate shard metrics"
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const shard = Number(process.env.SHARD);
          const browser = process.env.BROWSER;
          const workers = Number(process.env.WORKERS);
          const logFile = `shard-${shard}.log`;
          const exitFile = `shard-${shard}-exit-code.txt`;

          const log = fs.existsSync(logFile)
            ? fs.readFileSync(logFile, 'utf8')
            : '';

          const rawExitCode = fs.existsSync(exitFile)
            ? fs.readFileSync(exitFile, 'utf8').trim()
            : '';

          const exitCode = rawExitCode === '' || Number.isNaN(Number(rawExitCode))
            ? 1
            : Number(rawExitCode);

          // IMPORTANT:
          // Count metrics ONLY from this exact result-record shape:
          // [DIAG-DEBUG] testId="..." title="..." warnings=N errors=N skipped=N status=...
          //
          // Explicitly ignored:
          //   [DIAG-DEBUG] File contains: warnings=... errors=...
          //   console.error(...)
          //   server/HTTP/browser errors
          //   Node warnings/errors
          //   generic Playwright log output
          const diagRecordPattern = /^\s*\[DIAG-DEBUG\]\s+testId="([^"]+)"\s+title="(.*?)"\s+warnings=(\d+)\s+errors=(\d+)\s+skipped=(\d+)\s+status=([A-Za-z0-9_-]+)\s*$/;

          // Keep the LAST record for each testId so duplicate diagnostic output
          // does not inflate totals. If a retry produces a later final record,
          // that final record becomes the test's final reported state.
          const recordsByTestId = new Map();

          for (const line of log.split(/\r?\n/)) {
            const match = line.match(diagRecordPattern);
            if (!match) continue;

            const [, testId, title, warnings, errors, skipped, status] = match;
            recordsByTestId.set(testId, {
              line,
              testId,
              title,
              warnings: Number(warnings),
              errors: Number(errors),
              skipped: Number(skipped),
              status: status.toLowerCase()
            });
          }

          const records = [...recordsByTestId.values()];
          const total = (field) => records.reduce((sum, record) => sum + record[field], 0);

          const passed = records.filter(r => r.status === 'passed').length;
          const failed = records.filter(r => ['failed', 'error'].includes(r.status)).length;
          const flaky = records.filter(r => ['flaky', 'flaky-failed'].includes(r.status)).length;
          const skippedByField = total('skipped');
          const skippedByStatus = records.filter(r => ['skipped', 'skip'].includes(r.status)).length;
          const skipped = skippedByField > 0 ? skippedByField : skippedByStatus;

          const NOT_RUN_STATUSES = new Set([
            'didnotrun',
            'did-not-run',
            'notrun',
            'not-run',
            'not_run'
          ]);

          const didNotRun = records.filter(r => NOT_RUN_STATUSES.has(r.status)).length;
          const warnings = total('warnings');
          const errors = total('errors');

          // These are DIAG records only; unrelated log errors/warnings are not counted.
          const signalRecords = records
            .filter(r => r.warnings > 0 || r.errors > 0)
            .slice(0, 20);

          let dashboardStatus;
          if (exitCode !== 0) {
            dashboardStatus = 'failed';
          } else if (errors > 0 || failed > 0) {
            dashboardStatus = 'passed_with_diag_failures';
          } else if (warnings > 0) {
            dashboardStatus = 'passed_with_diag_warnings';
          } else {
            dashboardStatus = 'passed';
          }

          const metrics = {
            shard,
            totalShards: 8,
            browser,
            workers,
            exitCode,
            status: dashboardStatus,
            passed,
            failed,
            skipped,
            flaky,
            didNotRun,
            warnings,
            errors,
            diagTestRecords: records.length,
            signals: signalRecords.map(r => r.line)
          };

          fs.writeFileSync('shard-metrics.json', JSON.stringify(metrics, null, 2));
          NODE

      # ── Publish a clean summary without creating GitHub annotations ─────
      - name: "📝 Publish shard summary"
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'shard-metrics.json';
          if (!fs.existsSync(file)) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '## ⏺️ Shard metrics not available\n\nThe shard did not produce a metrics file.\n'
            );
            process.exit(0);
          }

          const m = JSON.parse(fs.readFileSync(file, 'utf8'));
          const icon = m.status === 'failed'
            ? '❌'
            : (m.status === 'passed_with_diag_failures'
              ? '⚠️'
              : (m.status === 'passed_with_diag_warnings' ? '🟡' : '✅'));

          let out = `# ${icon} Shard ${String(m.shard).padStart(2, '0')} / ${m.totalShards}\n\n`;
          out += '| Metric | Count |\n|---|---:|\n';
          out += `| ✅ Passed | **${m.passed}** |\n`;
          out += `| ❌ Failed | **${m.failed}** |\n`;
          out += `| ⏭️ Skipped | **${m.skipped}** |\n`;
          out += `| 🔁 Flaky | **${m.flaky}** |\n`;
          out += `| ⏹️ Did not run | **${m.didNotRun}** |\n`;
          out += `| ⚠️ DIAG-DEBUG warnings | **${m.warnings}** |\n`;
          out += `| 🚨 DIAG-DEBUG errors | **${m.errors}** |\n\n`;
          out += `**Browser:** \`${m.browser}\` &nbsp; **Workers:** \`${m.workers}\` &nbsp; **Playwright exit code:** \`${m.exitCode}\` &nbsp; **Unique DIAG tests:** \`${m.diagTestRecords}\`\n\n`;

          if (m.signals?.length) {
            out += `<details><summary>🔎 DIAG-DEBUG warning/error records (deduplicated by testId)</summary>\n\n`;
            out += '```text\n' + m.signals.join('\n') + '\n```\n\n';
            out += '</details>\n';
          } else {
            out += '✅ No warning/error signal records found in valid `[DIAG-DEBUG]` test-result lines.\n';
          }

          // No ::warning / ::error commands here. This keeps the Actions
          // Annotations section focused on real workflow issues rather than
          // turning expected diagnostic metrics into GitHub annotations.
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          NODE

      # ── Upload lightweight shard metrics + captured shard output ─────────
      - name: "📊 Upload shard metrics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-metrics-${{ matrix.shard }}
          path: |
            shard-metrics.json
            shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

      # ── Existing Playwright artifacts ───────────────────────────────────
      - name: "📊 Upload blob report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: "📋 Upload Playwright report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: "🧩 Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: "🔬 Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.shard }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════
  # 📈 CONSOLIDATED DASHBOARD
  # Always shows all 8 matrix slots, including NOT REPORTED shards.
  # ════════════════════════════════════════════════════════════════════════
  dashboard:
    name: "📈 Shard Matrix Dashboard"
    if: always()
    needs: test
    runs-on: ubuntu-24.04

    steps:
      # IMPORTANT: keep every shard artifact in its own directory.
      # All shard artifacts contain the same file name (shard-metrics.json);
      # merge-multiple=true would overwrite 7 of the 8 files.
      - name: "⬇️ Download shard metrics (one directory per shard)"
        uses: actions/download-artifact@v8
        with:
          pattern: shard-metrics-*
          merge-multiple: false
          path: shard-metrics

      - name: "🔍 Collect GitHub run metadata"
        uses: actions/github-script@v9
        env:
          BROWSER: ${{ inputs.browser || 'chromium' }}
          WORKERS: ${{ inputs.workers || '4' }}
          GREP: ${{ inputs.test_grep || 'all tests' }}
          SEND_REPORT: ${{ github.event_name != 'workflow_dispatch' || inputs.send_report == true }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;

            const [{ data: run }, { data: artifactsPage }] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId }),
              github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId, per_page: 100 })
            ]);

            const artifacts = artifactsPage.artifacts || [];
            const artifactBytes = artifacts.reduce((n, a) => n + Number(a.size_in_bytes || 0), 0);

            const formatBytes = (bytes) => {
              if (!bytes) return '0 B';
              const units = ['B', 'KB', 'MB', 'GB', 'TB'];
              let n = bytes;
              let i = 0;
              while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
              return `${n.toFixed(i >= 2 ? 1 : 0)} ${units[i]}`;
            };

            const started = run.run_started_at || run.created_at;
            let durationSeconds = null;
            if (started && run.updated_at) {
              durationSeconds = Math.max(0, Math.round((new Date(run.updated_at) - new Date(started)) / 1000));
            }

            fs.writeFileSync('run-metadata.json', JSON.stringify({
              run: {
                id: run.id,
                number: run.run_number,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                branch: run.head_branch || run.head_ref || '',
                sha: run.head_sha || '',
                actor: run.actor?.login || '',
                url: run.html_url,
                createdAt: run.created_at,
                startedAt: started,
                updatedAt: run.updated_at,
                durationSeconds
              },
              config: {
                browser: process.env.BROWSER,
                workers: Number(process.env.WORKERS),
                grep: process.env.GREP,
                sendReport: process.env.SEND_REPORT
              },
              artifacts: {
                count: artifacts.filter(a => !a.expired).length,
                sizeBytes: artifactBytes,
                sizeHuman: formatBytes(artifactBytes)
              }
            }, null, 2));


      - name: "📈 Build consolidated shard dashboard"
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER: ${{ inputs.browser || 'chromium' }}
          WORKERS: ${{ inputs.workers || '4' }}
          GREP: ${{ inputs.test_grep || 'all tests' }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const TOTAL_SHARDS = 8;
          const dir = 'shard-metrics';
          const metricsByShard = new Map();

          if (fs.existsSync(dir)) {
            const walk = (root) => {
              const results = [];
              for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
                const full = `${root}/${entry.name}`;
                if (entry.isDirectory()) results.push(...walk(full));
                else results.push(full);
              }
              return results;
            };

            for (const file of walk(dir).filter(f => f.endsWith('.json'))) {
              try {
                const metric = JSON.parse(fs.readFileSync(file, 'utf8'));
                if (Number.isInteger(metric.shard)) {
                  metricsByShard.set(metric.shard, metric);
                }
              } catch (error) {
                // Ignore malformed metric files; the corresponding shard will
                // be represented as NOT REPORTED below.
              }
            }
          }

          let runMeta = null;
          if (fs.existsSync('run-metadata.json')) {
            try { runMeta = JSON.parse(fs.readFileSync('run-metadata.json', 'utf8')); }
            catch (_) { runMeta = null; }
          }

          const rows = Array.from({ length: TOTAL_SHARDS }, (_, index) => {
            const shard = index + 1;
            return metricsByShard.get(shard) || {
              shard,
              totalShards: TOTAL_SHARDS,
              browser: process.env.BROWSER,
              workers: Number(process.env.WORKERS),
              exitCode: null,
              status: 'not_reported',
              passed: 0,
              failed: 0,
              skipped: 0,
              flaky: 0,
              didNotRun: 0,
              warnings: 0,
              errors: 0,
              diagTestRecords: 0,
              signals: []
            };
          });

          const sum = key => rows.reduce((total, row) => total + Number(row[key] || 0), 0);
          const reportedRows = rows.filter(r => r.status !== 'not_reported');
          const passedShards = rows.filter(r => r.status === 'passed').length;
          const diagFailureShards = rows.filter(r => r.status === 'passed_with_diag_failures').length;
          const diagWarningShards = rows.filter(r => r.status === 'passed_with_diag_warnings').length;
          const failedShards = rows.filter(r => r.status === 'failed').length;
          const missingShards = rows.filter(r => r.status === 'not_reported').length;

          let overallIcon = '✅';
          let overallText = 'ALL REPORTED';
          if (missingShards > 0) {
            overallIcon = '⏺️';
            overallText = 'INCOMPLETE';
          } else if (failedShards > 0) {
            overallIcon = '❌';
            overallText = 'PLAYWRIGHT FAILURES';
          } else if (diagFailureShards > 0) {
            overallIcon = '⚠️';
            overallText = 'DIAG FAILURES';
          } else if (diagWarningShards > 0) {
            overallIcon = '🟡';
            overallText = 'DIAG WARNINGS';
          }

          let out = `# ${overallIcon} Playwright Shard Matrix — ${overallText}\n\n`;
          out += `> **DataStore GeoWGS84** · 8-way parallel execution · metrics are based only on valid \`[DIAG-DEBUG]\` test-result records.\n\n`;

          if (runMeta?.run) {
            const r = runMeta.run;
            const local = (value) => value ? new Date(value).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) : '—';
            const duration = r.durationSeconds == null ? '—' : (() => {
              const h = Math.floor(r.durationSeconds / 3600);
              const m = Math.floor((r.durationSeconds % 3600) / 60);
              const sec = r.durationSeconds % 60;
              return h ? `${h}h ${m}m ${sec}s` : `${m}m ${sec}s`;
            })();

            out += '## 🧾 Run information\n\n';
            out += '| Run | Trigger | Branch | Commit | Actor | Started (IST) | Duration | Artifacts |\n';
            out += '|---:|---|---|---|---|---|---:|---:|\n';
            out += `| [**#${r.number}**](${r.url}) | \`${r.event}\` | \`${r.branch || '—'}\` | \`${(r.sha || '').slice(0, 10) || '—'}\` | \`${r.actor || '—'}\` | ${local(r.startedAt)} | **${duration}** | **${runMeta.artifacts?.count ?? '—'}** (${runMeta.artifacts?.sizeHuman ?? '—'}) |\n\n`;
          }

          out += '## ⚙️ Execution configuration\n\n';
          out += '| Browser | Workers / shard | Test filter | Email report | Playwright matrix result |\n';
          out += '|---|---:|---|---|---|\n';
          out += `| \`${process.env.BROWSER}\` | **${process.env.WORKERS}** | \`${process.env.GREP}\` | ${runMeta?.config?.sendReport === 'true' ? '📧 Enabled' : '📭 Disabled'} | \`${process.env.TEST_RESULT}\` |\n\n`;

          out += '## 📊 Run overview\n\n';
          out += '| Matrix health | Shards | Tests | Passed | Failed | Skipped | Flaky | DIAG warnings | DIAG errors |\n';
          out += '|---|---:|---:|---:|---:|---:|---:|---:|---:|\n';
          const totalTests = reportedRows.reduce((n, r) => n + Number(r.diagTestRecords || 0), 0);
          out += `| **${passedShards}/${TOTAL_SHARDS} clean** | **${reportedRows.length}/${TOTAL_SHARDS} reported** | **${totalTests}** | **${sum('passed')}** | **${sum('failed')}** | **${sum('skipped')}** | **${sum('flaky')}** | **${sum('warnings')}** | **${sum('errors')}** |\n\n`;

          if (failedShards > 0) {
            out += `> ❌ **${failedShards} shard(s)** have a non-zero Playwright exit code.\n\n`;
          }
          if (diagFailureShards > 0) {
            out += `> ⚠️ **${diagFailureShards} shard(s)** contain [DIAG-DEBUG] failures even though the Playwright process itself exited successfully.\n\n`;
          }
          if (diagWarningShards > 0) {
            out += `> 🟡 **${diagWarningShards} shard(s)** contain [DIAG-DEBUG] warnings.\n\n`;
          }
          if (missingShards > 0) {
            out += `> ⏺️ **${missingShards} shard(s)** did not produce a metrics artifact and are shown as **NOT REPORTED**.\n\n`;
          }

          out += '## 🧪 Shard matrix\n\n';
          out += '| Shard | Status | Passed | Failed | Skipped | Flaky | Warn | Error | Exit |\n';
          out += '|---|---|---:|---:|---:|---:|---:|---:|---:|\n';

          for (const r of rows) {
            let status;
            switch (r.status) {
              case 'failed':
                status = '❌ FAIL';
                break;
              case 'passed_with_diag_failures':
                status = '⚠️ DIAG FAIL';
                break;
              case 'passed_with_diag_warnings':
                status = '🟡 WARN';
                break;
              case 'passed':
                status = '✅ PASS';
                break;
              default:
                status = '⏺️ NOT REPORTED';
            }

            const exit = r.exitCode === null || r.exitCode === undefined ? '—' : r.exitCode;
            out += `| **${String(r.shard).padStart(2, '0')} / 08** | ${status} | ${r.passed} | ${r.failed} | ${r.skipped} | ${r.flaky} | ${r.warnings} | ${r.errors} | ${exit} |\n`;
          }

          out += '\n## 🔎 Shard details\n\n';
          for (const r of rows) {
            const icon = r.status === 'failed'
              ? '❌'
              : (r.status === 'passed_with_diag_failures'
                ? '⚠️'
                : (r.status === 'passed_with_diag_warnings'
                  ? '🟡'
                  : (r.status === 'not_reported' ? '⏺️' : '✅')));

            out += `<details><summary>${icon} Shard ${String(r.shard).padStart(2, '0')} · ${r.status.replaceAll('_', ' ')} · ${r.passed} passed · ${r.failed} failed · ${r.warnings} warn · ${r.errors} error</summary>\n\n`;

            if (r.status === 'not_reported') {
              out += 'No `shard-metrics.json` artifact was produced for this shard. Open the shard job to inspect where execution stopped.\n\n';
            } else {
              out += `**Playwright exit code:** \`${r.exitCode}\` &nbsp; **Unique DIAG tests:** \`${r.diagTestRecords}\`\n\n`;
              if (r.signals?.length) {
                out += '```text\n' + r.signals.join('\n') + '\n```\n\n';
              } else {
                out += 'No valid `[DIAG-DEBUG]` warning/error records detected. `File contains:` lines and unrelated console/server/browser messages are ignored.\n\n';
              }
            }

            out += '</details>\n\n';
          }

          out += '## 🧭 Interpretation\n\n';
          out += '- **✅ PASS:** Playwright exit code 0 and no DIAG warnings/errors.\n';
          out += '- **🟡 WARN:** Playwright exit code 0 with DIAG warnings only.\n';
          out += '- **⚠️ DIAG FAIL:** Playwright exit code 0, but DIAG reports test failures/errors.\n';
          out += '- **❌ FAIL:** Playwright itself returned a non-zero exit code.\n';
          out += '- **⏺️ NOT REPORTED:** no metrics artifact was available for that shard.\n\n';
          out += '> **Important:** The dashboard does not count generic browser, console, HTTP, server, Node, or Playwright log messages as DIAG warnings/errors. Only exact `[DIAG-DEBUG]` test-result records are used.\n';

          out += `\n[🔗 Open this GitHub Actions run](${runMeta?.run?.url || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`})\n`;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          fs.writeFileSync('run-matrix.json', JSON.stringify({
            run: runMeta?.run || null,
            config: runMeta?.config || null,
            artifacts: runMeta?.artifacts || null,
            totals: {
              shardsTotal: TOTAL_SHARDS,
              shardsReported: reportedRows.length,
              shardsMissing: missingShards,
              cleanShards: passedShards,
              diagFailureShards,
              diagWarningShards,
              playwrightFailureShards: failedShards,
              tests: totalTests,
              passed: sum('passed'),
              failed: sum('failed'),
              skipped: sum('skipped'),
              flaky: sum('flaky'),
              warnings: sum('warnings'),
              errors: sum('errors')
            },
            shards: rows
          }, null, 2));
          NODE

      - name: "📦 Upload consolidated run data"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-matrix-data
          path: |
            run-metadata.json
            run-matrix.json
          if-no-files-found: ignore
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════
  # 📨 ORIGINAL CONSOLIDATED EMAIL REPORT
  # Existing report flow retained.
  # ════════════════════════════════════════════════════════════════════════
  email-report:
    name: "📨 Email Report"
    # Always create the job so the run clearly shows whether email was sent
    # or intentionally disabled on a manual run.
    if: always()
    needs: [test, dashboard]
    runs-on: ubuntu-24.04

    steps:
      - name: "📧 Email report decision"
        env:
          SHOULD_SEND: ${{ github.event_name != 'workflow_dispatch' || inputs.send_report == true }}
        run: |
          if [[ "$SHOULD_SEND" == "true" ]]; then
            echo "📧 Email report is enabled for this run."
            { echo '## 📧 Email Report'; echo; echo '✅ Email sending is **enabled** for this run.'; echo; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📭 Email report disabled by manual input."
            { echo '## 📧 Email Report'; echo; echo '⏭️ Email sending was **disabled** by the `send_report` manual input.'; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "🔐 Check email configuration (names only)"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        env:
          DAILY_REPORT_EMAILS:  ${{ secrets.DAILY_REPORT_EMAILS }}
          FAILURE_ALERT_EMAILS: ${{ secrets.FAILURE_ALERT_EMAILS }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:          ${{ secrets.SMTP_SECURE }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          SMTP_FROM:            ${{ secrets.SMTP_FROM }}
        run: |
          has_value() { [[ -n "${!1:-}" ]] && echo '✅ configured' || echo '❌ missing'; }
          echo "DAILY_REPORT_EMAILS:  $(has_value DAILY_REPORT_EMAILS)"
          echo "FAILURE_ALERT_EMAILS: $(has_value FAILURE_ALERT_EMAILS)"
          echo "SMTP_HOST:            $(has_value SMTP_HOST)"
          echo "SMTP_PORT:            $(has_value SMTP_PORT)"
          echo "SMTP_SECURE:          $(has_value SMTP_SECURE)"
          echo "SMTP_USER:            $(has_value SMTP_USER)"
          echo "SMTP_PASS:            $(has_value SMTP_PASS)"
          echo "SMTP_FROM:            $(has_value SMTP_FROM)"

          {
            echo '## 🔐 Email configuration';
            echo;
            echo '| Setting | Status |';
            echo '|---|---|';
            echo "| DAILY_REPORT_EMAILS | $(has_value DAILY_REPORT_EMAILS) |";
            echo "| FAILURE_ALERT_EMAILS | $(has_value FAILURE_ALERT_EMAILS) |";
            echo "| SMTP_HOST | $(has_value SMTP_HOST) |";
            echo "| SMTP_PORT | $(has_value SMTP_PORT) |";
            echo "| SMTP_SECURE | $(has_value SMTP_SECURE) |";
            echo "| SMTP_USER | $(has_value SMTP_USER) |";
            echo "| SMTP_PASS | $(has_value SMTP_PASS) |";
            echo "| SMTP_FROM | $(has_value SMTP_FROM) |";
            echo;
            echo '> Secret values are not printed.';
            echo;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📥 Checkout repository"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/checkout@v7

      - name: "⬢ Setup Node.js 22"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: "📦 Install dependencies"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        run: npm ci

      - name: "⬇️ Download diagnostics"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/download-artifact@v8
        with:
          pattern: diagnostics-*
          merge-multiple: true
          path: diagnostics

      - name: "⬇️ Download test results"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      - name: "⬇️ Download Playwright reports"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-report-*
          merge-multiple: true
          path: playwright-report

      - name: "⬇️ Download blob reports"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: blob-reports

      - name: "📨 Send consolidated report"
        if: github.event_name != 'workflow_dispatch' || inputs.send_report == true
        env:
          CI: "true"
          DAILY_REPORT_EMAILS:  ${{ secrets.DAILY_REPORT_EMAILS }}
          FAILURE_ALERT_EMAILS: ${{ secrets.FAILURE_ALERT_EMAILS }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:          ${{ secrets.SMTP_SECURE }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          SMTP_FROM:            ${{ secrets.SMTP_FROM }}
        run: |
          set +e
          npm run report:email
          EMAIL_EXIT=$?
          set -e

          if [[ "$EMAIL_EXIT" -eq 0 ]]; then
            echo "✅ Email report command completed successfully."
            { echo '## 📬 Email delivery result'; echo; echo '✅ `npm run report:email` completed successfully.'; echo; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Email report command failed with exit code $EMAIL_EXIT."
            { echo '## 📬 Email delivery result'; echo; echo "❌ \`npm run report:email\` failed with exit code **$EMAIL_EXIT**. Check the step log and SMTP/recipient secrets."; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$EMAIL_EXIT"
